name: PostgreSQL-only gate and real handler integration
on:
  pull_request:
    paths:
      - '.openai/hosting.json'
      - 'app/**'
      - 'db/**'
      - 'lib/**'
      - 'drizzle.config.ts'
      - 'drizzle-pg/**'
      - 'cloudflare-env.d.ts'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/postgres-only-integration.yml'
      - '.github/workflows/nextcrm-minio-signed-upload-smoke.yml'
  push:
    branches:
      - integration/nextcrm-homologation-wave1-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-only-integration:
    name: PostgreSQL-only source + migrations + real handlers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: ci-only-isolated-database
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cisne_ci:ci-only-isolated-database@127.0.0.1:5432/cisne_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject incompatible NextCRM migration lineage before PostgreSQL changes
        run: node --test scripts/nextcrm-migration-preflight.test.mjs
      - name: Reject duplicate active migration DDL before any PostgreSQL changes
        run: |
          node --test scripts/audit-active-migrations.test.mjs
          node --test scripts/legacy-schema-parity.test.mjs
          node scripts/audit-active-migrations.mjs
      - name: Reject D1 bindings and require PostgreSQL persistence
        run: node scripts/assert-postgres-only.mjs
      - name: Compile and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Verify test database is loopback before any migration
        run: |
          node -e "const u = new URL(process.env.DATABASE_URL); if(u.hostname!=='127.0.0.1'||u.pathname!=='/cisne_ci')process.exit(1)"
      - name: Rehearse finance-first and document-first NextCRM schema histories
        run: node scripts/rehearse-nextcrm-dual-lineage.mjs
      - name: Rehearse real Financeiro upgrade over document-first staging history
        run: node scripts/rehearse-rc-document-first-finance-upgrade.mjs
      - name: Restore legacy 36-table PostgreSQL baseline in throwaway CI database
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          const url = new URL(process.env.DATABASE_URL);
          if (url.hostname !== '127.0.0.1' || url.pathname !== '/cisne_ci') {
            throw new Error('NO-GO: only ephemeral CI database is permitted');
          }
          const sql = await readFile('drizzle-pg/0000_salty_lilith.sql','utf8');
          const queries = sql.split('--> statement-breakpoint').map(s=>s.trim()).filter(Boolean);
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const c = await pool.connect();
          try {
            await c.query('BEGIN');
            await c.query('CREATE TABLE _cisne_schema_migrations(id text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())');
            for (const statement of queries) await c.query(statement);
            await c.query("INSERT INTO _cisne_schema_migrations(id) VALUES('0000_salty_lilith')");
            await c.query('COMMIT');
            const count = await c.query("SELECT COUNT(*)::int AS n FROM information_schema.tables WHERE table_schema='public' AND table_name NOT LIKE '\\_%' ESCAPE '\\'");
            if (count.rows[0].n !== 36) throw new Error('Legacy baseline is not 36 tables');
            console.log('Legacy baseline installed: 36 domain tables, no NextCRM link tables');
          } catch (e) {
            await c.query('ROLLBACK').catch(()=>{});
            throw e;
          } finally { c.release(); await pool.end(); }
          JS
      - name: Upgrade existing PostgreSQL schema with additive NextCRM migration
        run: pnpm db:migrate
      - name: Read-only audit of ledger and NextCRM schema after migration
        run: node scripts/audit-nextcrm-migration-ledger-readonly.mjs
      - name: Read-only SQL inventory against ephemeral PostgreSQL (same SQL as future HML)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --read-only \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=cisne_ci \
            -e PGPASSWORD=ci-only-isolated-database -e PGDATABASE=cisne_ci \
            -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=12000' \
            -v "$PWD/scripts/audit-postgres-staging-readonly.sql:/audit.sql:ro" \
            postgres:18 psql -X --set ON_ERROR_STOP=1 --no-align --tuples-only \
            --field-separator='|' --file=/audit.sql > /tmp/cisne-pg-readonly-audit.txt
          grep -Fx 'READ_ONLY|session|on' /tmp/cisne-pg-readonly-audit.txt
          grep -Fx 'TABLES_PRESENT|public|36' /tmp/cisne-pg-readonly-audit.txt
          test "$(grep -c '^ROW_COUNT|' /tmp/cisne-pg-readonly-audit.txt)" -eq 36
          echo 'Read-only audit: expected 36 tables and counts all readable; no row values exported.'
      - name: Test PostgreSQL SQL adapter and security guards
        run: |
          pnpm test:postgres-adapter
          pnpm test:security
      - name: Run real enterprise handlers against PostgreSQL
        run: pnpm test:integration
      - name: Apply additive NextCRM migration idempotently
        run: |
          pnpm db:migrate
          node --input-type=module <<'JS'
          import { Pool } from 'pg';
          const pool = new Pool({connectionString:process.env.DATABASE_URL});
          const r = await pool.query("SELECT id,COUNT(*)::int AS n FROM _cisne_schema_migrations GROUP BY id ORDER BY id");
          const expected = [
            '0000_salty_lilith',
            '0001_native_crm',
            '0002_crm_proposal_origin',
            '0003_finance_audit',
            '0003_nextcrm_document_bridge',
            '0004_cash_transfers',
            '0005_finance_period_closes',
            '0006_cisne_company_service_catalog',
            '0007_field_planning',
          ];
          if (r.rows.length !== expected.length || r.rows.some(x => x.n !== 1) ||
              r.rows.some((x, i) => x.id !== expected[i])) process.exitCode=1;
          await pool.end();
          JS
      - name: Require read-only evidence of company catalog 0006, FKs and seed
        run: |
          node --test scripts/audit-company-catalog-readonly.test.mjs
          node scripts/audit-company-catalog-readonly.mjs
          node --input-type=module -e "import {Pool} from 'pg';import {auditFieldPlanning} from './scripts/audit-field-planning-readonly.mjs';const p=new Pool({connectionString:process.env.DATABASE_URL});const c=await p.connect();try{await c.query('BEGIN READ ONLY');console.log('FIELD_PLANNING_EVIDENCE_OK',await auditFieldPlanning(c));await c.query('ROLLBACK')}finally{c.release();await p.end()}"
      - name: Test NextCRM OS ownership against real ephemeral PostgreSQL
        run: NODE_ENV=test node --import tsx --test test/integration/nextcrm-owner-lookup.test.ts
      - name: Generate synthetic D1 dump with exact ERP tables (NO real data)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('drizzle-pg/0000_salty_lilith.sql').read_text('utf-8')
          tables = [part.strip() for part in sql.split('--> statement-breakpoint') if part.strip().startswith('CREATE TABLE "')]
          assert len(tables) == 36, f'unexpected ERP table inventory: {len(tables)}'
          Path('cutover-private').mkdir(mode=0o700, exist_ok=True)
          fixture = 'BEGIN TRANSACTION;\n' + '\n'.join(tables) + """
          INSERT INTO "clients" ("id", "owner_id", "legal_name", "created_at", "updated_at")
          VALUES ('ci-test-client', 'ci-actor', 'Fictitious Test Company', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z');
          COMMIT;
          """
          Path('cutover-private/synthetic.d1-export.sql').write_text(fixture, encoding='utf-8')
          PY
      - name: Insert the same synthetic fixture into ephemeral PostgreSQL
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const c = new pg.Client({connectionString:process.env.DATABASE_URL});
          await c.connect();
          try {
            await c.query('INSERT INTO clients(id,owner_id,legal_name,created_at,updated_at) VALUES($1,$2,$3,$4,$5)',
              ['ci-test-client','ci-actor','Fictitious Test Company','2026-01-01T00:00:00Z','2026-01-01T00:00:00Z']);
          } finally { await c.end(); }
          JS
      - name: Reset disposable ERP baseline before parity audit
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const c = new pg.Client({connectionString:process.env.DATABASE_URL});
          await c.connect();
          try {
            const tables = await c.query("SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename NOT LIKE 'crm_%' AND tablename <> '_cisne_schema_migrations'");
            for (const row of tables.rows) {
              const table = row.tablename.replaceAll('"','""');
              await c.query(`TRUNCATE TABLE public."${table}" CASCADE`);
            }
            await c.query('INSERT INTO clients(id,owner_id,legal_name,created_at,updated_at) VALUES($1,$2,$3,$4,$5)',
              ['ci-test-client','ci-actor','Fictitious Test Company','2026-01-01T00:00:00Z','2026-01-01T00:00:00Z']);
          } finally { await c.end(); }
          JS
      - name: Audit all tables and content hashes of synthetic source and destination
        shell: bash
        run: |
          python3 scripts/d1-export-fingerprint.py \
            --sql cutover-private/synthetic.d1-export.sql \
            --output cutover-private/synthetic.d1-manifest.json
          node scripts/verify-postgres-cutover.mjs \
            --source cutover-private/synthetic.d1-manifest.json
      - name: Reject deliberate PostgreSQL drift (negative gate)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const c = new pg.Client({connectionString:process.env.DATABASE_URL});
          await c.connect();
          try {
            await c.query('UPDATE clients SET legal_name=$1 WHERE id=$2',
              ['ALTERED-ONLY-IN-POSTGRES','ci-test-client']);
          } finally { await c.end(); }
          JS
          if node scripts/verify-postgres-cutover.mjs --source cutover-private/synthetic.d1-manifest.json; then
            echo 'ERROR: parity script accepted a corrupted PostgreSQL record' >&2
            exit 1
          fi
          echo 'The parity gate correctly rejected mismatched content.'
      # Link/audit fixtures are immutable and intentionally remain in the disposable DB.
      # Run these AFTER D1-to-PG parity checks, which expect only one synthetic row.
      - name: Test persistent NextCRM document link, idempotency and immutable audit
        run: NODE_ENV=test node --import tsx --test test/integration/nextcrm-document-link.test.ts
      - name: Test approved PostgreSQL mappings through signed HTTP bridge and persisted audit
        run: NODE_ENV=test node --import tsx --test test/integration/nextcrm-mapped-bridge.test.ts

