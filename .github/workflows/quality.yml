name: quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:domain
      - run: node --test test/enterprise-header-staging.contract.test.mjs test/enterprise-responsive-staging.contract.test.mjs test/enterprise-module-description.contract.test.mjs test/enterprise-process-journey-navigation.contract.test.mjs
      - run: pnpm build
  enterprise-ui-playwright:
    name: Enterprise UI browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-ui-screenshots-${{ github.sha }}
          path: |
            test-results/enterprise/**/*.png
            test-results/enterprise/**/*.json
          if-no-files-found: warn
