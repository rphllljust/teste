name: quality
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'test/**']
  pull_request:
    branches: [main, 'feat/tier1-enterprise-document-linking-20261127']
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:domain
      - run: pnpm test:route-inventory
      - run: pnpm test:enterprise-contracts
      - run: pnpm test:enterprise-quality-contracts
      - run: pnpm build
