name: NextCRM public gateway denies private bridge (container)

on:
  pull_request:
    paths:
      - 'integrations/nextcrm-public-gateway/**'
      - 'config/nextcrm-staging-topology.json'
      - '.github/workflows/nextcrm-public-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-boundary:
    name: NextCRM public gateway blocks internal bridge at edge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate NextCRM gateway Caddyfile and compile ephemeral container
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain -t nextcrm-public-gateway-ci:verify integrations/nextcrm-public-gateway
          docker run --rm -e NEXTCRM_UPSTREAM=nextcrm-web.railway.internal:3000 \
            --entrypoint caddy nextcrm-public-gateway-ci:verify \
            validate --config /etc/caddy/Caddyfile
      - name: Test public routes while denying every internal bridge request
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f nextcrm-public-gateway-ci nextcrm-public-backend-ci >/dev/null 2>&1 || true; docker network rm nextcrm-public-gw-test >/dev/null 2>&1 || true' EXIT
          docker network create nextcrm-public-gw-test
          docker run -d --rm --name nextcrm-public-backend-ci \
            --network nextcrm-public-gw-test --network-alias nextcrm-web.railway.internal \
            busybox:1.36 sh -ec '
              mkdir -p /www/api/internal;
              printf "NEXTCRM_PUBLIC_OK" >/www/index.html;
              printf "PRIVATE_PATH_WAS_LEAKED" >/www/api/internal/erp-document-authorization;
              exec httpd -f -p 3000 -h /www
            '
          docker run -d --rm --name nextcrm-public-gateway-ci \
            --network nextcrm-public-gw-test -e NEXTCRM_UPSTREAM=nextcrm-web.railway.internal:3000 \
            -p 127.0.0.1:18080:8080 nextcrm-public-gateway-ci:verify
          # The gateway must report health without forwarding to the backend.
          gateway_ready=0
          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 2 http://127.0.0.1:18080/__gateway_health || true)" = ready ]; then
              gateway_ready=1; break
            fi
            sleep 1
          done
          test "$gateway_ready" -eq 1
          ready=0
          for i in $(seq 1 30); do
            if [ "$(curl -sS --max-time 2 http://127.0.0.1:18080/ || true)" = NEXTCRM_PUBLIC_OK ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          for verb in GET POST; do
            for path in /api/internal /api/internal/ /api/internal/erp-document-authorization; do
              status="$(curl -sS --max-time 3 -o /tmp/nextcrm-blocked-body -w '%{http_code}' -X "$verb" \
                "http://127.0.0.1:18080$path")"
              test "$status" = 404
              ! grep -q PRIVATE_PATH_WAS_LEAKED /tmp/nextcrm-blocked-body
            done
          done
          echo "PASS: public NextCRM gateway forwards pages but denies /api/internal/* before backend."
      - name: No public domain, registry push, database write or Railway deployment
        run: echo 'Ephemeral gateway tests only; not deployed.'
