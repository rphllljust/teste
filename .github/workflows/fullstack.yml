name: CISNE full-stack checks
on:
  pull_request:
  push:
    branches:
      - feat/enterprise-mrp-wave5

permissions:
  contents: read

jobs:
  domain-invariants:
    name: Domain invariants (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Execute MRP and shared purchasing valuation tests
        run: node --experimental-strip-types --test lib/domain/purchase-order-pricing.test.mjs
      - name: Validate staging CRM navigation and production deny-by-default
        run: node --experimental-strip-types --test lib/integrations/nextcrm/public-navigation.test.mjs lib/integrations/nextcrm/native-crm-ui.test.mjs
      - name: Reject unsafe historical NextCRM migration combinations
        run: node --test scripts/nextcrm-migration-preflight.test.mjs
      - name: Reject duplicate DDL across active finance and NextCRM migrations
        run: |
          node --test scripts/audit-active-migrations.test.mjs
          node scripts/audit-active-migrations.mjs
      - name: Reject unverified production and staging migration
        run: node --test scripts/migration-safety.test.mjs
      - name: Validate staging signed session and public HTTPS mutation origin
        run: node --test lib/api/http-auth.test.mjs lib/api/staging-session.test.mjs lib/api/mutation-origin.test.mjs lib/api/request-identity.test.mjs lib/runtime/readiness.test.mjs
      - name: Reject legacy CRM, unsafe ERP predeploy, and unapproved PG18 volumes
        run: node --test lib/integrations/nextcrm/approved-railway-targets.test.mjs scripts/rc86-isolated-erp-preflight.test.mjs scripts/rc87-erp-persistence-gate.test.mjs scripts/railway-wrangler-bindings.test.mjs

  application-build:
    name: Full application source and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Verify tracked application source
        run: |
          test -f scripts/run-framework.mjs
          test -f scripts/sites-env.mjs
          test -f build/sites-vite-plugin.ts
          test -f build/connector-preview-plugin.mjs
          test -f .openai/hosting.json
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Cross-system document ACL and strict input contracts
        run: node --import tsx --test lib/integrations/nextcrm/bridge-protocol.test.mjs lib/integrations/nextcrm/document-link-contract.test.mjs lib/integrations/nextcrm/document-link-preflight.test.mjs
      - name: Audit classification and fail-closed behavior with synthetic catalog
        run: node --test scripts/audit-nextcrm-migration-ledger-readonly.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build

  postgres-handler-integration:
    name: PostgreSQL ${{ matrix.postgres }} handler + restore (Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: cisne_test
          POSTGRES_PASSWORD: cisne_test
          POSTGRES_DB: cisne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_test -d cisne_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://cisne_test:cisne_test@localhost:5432/cisne_test
      NODE_ENV: test
      CISNE_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Rehearse BOTH NextCRM migration histories in disposable schemas
        run: node scripts/rehearse-nextcrm-dual-lineage.mjs
      - name: Rehearse real Financeiro upgrade over document-first staging history
        run: node scripts/rehearse-rc-document-first-finance-upgrade.mjs
      - name: Apply migrations twice to prove replay safety
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Read-only audit of schema ledger and NextCRM bridge catalog
        run: node scripts/audit-nextcrm-migration-ledger-readonly.mjs
      - name: Execute actual route handlers against PostgreSQL
        run: pnpm test:integration
      - name: Prove backup and full restore into a separate disposable PostgreSQL database
        run: node scripts/verify-postgres-restore.mjs
