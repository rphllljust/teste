name: Publish immutable NextCRM staging candidate

on:
  push:
    branches:
      - integration/erp-postgres-nextcrm-candidate-20261115
      - release/nextcrm-staging-pr21-20261115
    paths:
      - '.github/workflows/nextcrm-candidate-image-publish.yml'
      - '.gitmodules'
      - 'Dockerfile.nextcrm'
      - 'integrations/nextcrm-bridge-overlay/**'
      - 'integrations/nextcrm-upstream'
      - 'lib/integrations/nextcrm/bridge-protocol.ts'
      - 'scripts/nextcrm-staging-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nextcrm-candidate-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish SHA-pinned candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout exact source and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable NextCRM upstream revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C integrations/nextcrm-upstream rev-parse HEAD)" = d3bead9b44efe2cf94d0dfc2948af0f2c9270deb
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Select lowercase GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/cisne-nextcrm"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nextcrm
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=candidate-${{ github.sha }}
          cache-from: type=gha,scope=nextcrm-candidate
          cache-to: type=gha,mode=max,scope=nextcrm-candidate

      - name: Record immutable deployment reference
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.build.outputs.digest }}"
          {
            echo '## NextCRM staging candidate'
            echo
            echo 'Published immutable OCI image:'
            echo
            echo '```text'
            echo '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'
            echo '```'
            echo
            echo 'This workflow does not deploy Railway or modify any database.'
          } >> "$GITHUB_STEP_SUMMARY"
