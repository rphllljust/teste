name: CISNE HML — Chromium and enterprise ACL acceptance

on:
  pull_request:
    branches: [main, 'feat/tier1-enterprise-document-linking-20261127']
    paths:
      - '.github/workflows/cisne-hml-live-acceptance.yml'
      - 'test/hml-live-acceptance.mjs'
  workflow_dispatch:
    inputs:
      require_authenticated:
        description: 'Enforce signed-session and persisted-document proof (no skip)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cisne-hml-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-hml-read-only:
    name: Live Staging — no mutation, Chromium desktop/tablet/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install pinned Chromium only on this ephemeral CI runner
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/cisne-hml-browser"
          npm install --prefix "${RUNNER_TEMP}/cisne-hml-browser" --no-save --no-audit --no-fund playwright@1.65.1
          "${RUNNER_TEMP}/cisne-hml-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify Railway Staging from a real browser
        shell: bash
        env:
          CISNE_HML_BASE_URL: https://cisne-web-staging-staging.up.railway.app
          CISNE_HML_LOGIN_PASSPHRASE: ${{ secrets.CISNE_HML_LOGIN_PASSPHRASE }}
          CISNE_HML_REQUIRE_AUTH: ${{ github.event_name == 'workflow_dispatch' && inputs.require_authenticated && '1' || '0' }}
          CISNE_HML_ARTIFACT_DIR: ${{ runner.temp }}/cisne-hml-public
        run: |
          cp test/hml-live-acceptance.mjs "${RUNNER_TEMP}/cisne-hml-browser/verify.mjs"
          cd "${RUNNER_TEMP}/cisne-hml-browser"
          node ./verify.mjs
      - name: Preserve only PRE-login screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cisne-hml-unauthenticated-shell
          path: ${{ runner.temp }}/cisne-hml-public/unauthenticated-*.png
          if-no-files-found: ignore
          retention-days: 3
