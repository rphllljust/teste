name: NextCRM signed bridge — actual Prisma and ephemeral PostgreSQL

on:
  push:
    branches:
      - integration/rc81-nextcrm-private-file-ticket-contract-20261116
  pull_request:
    paths:
      - 'integrations/nextcrm-bridge-overlay/**'
      - 'lib/integrations/nextcrm/**'
      - 'scripts/install-nextcrm-bridge-overlay.mjs'
      - '.github/workflows/nextcrm-bridge-prisma-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prisma-bridge-real-db:
    name: NextCRM signed document scopes with REAL Prisma/PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nextcrm_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: nextcrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextcrm_ci -d nextcrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nextcrm_ci:ci-only-ephemeral@127.0.0.1:5432/nextcrm_ci
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned NextCRM SHA and isolated database target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C integrations/nextcrm-upstream rev-parse HEAD)" = d3bead9b44efe2cf94d0dfc2948af0f2c9270deb
          test "$DATABASE_URL" = 'postgresql://nextcrm_ci:ci-only-ephemeral@127.0.0.1:5432/nextcrm_ci'
          test ! -f integrations/nextcrm-upstream/.env
          test ! -f integrations/nextcrm-upstream/.env.local
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: integrations/nextcrm-upstream/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: integrations/nextcrm-upstream/pnpm-lock.yaml
      - name: Install NextCRM dependencies without lifecycle scripts
        working-directory: integrations/nextcrm-upstream
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate exact-version Prisma Client
        working-directory: integrations/nextcrm-upstream
        run: pnpm exec prisma generate
      - name: Migrate EXCLUSIVELY throwaway NextCRM PostgreSQL
        shell: bash
        working-directory: integrations/nextcrm-upstream
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://nextcrm_ci:ci-only-ephemeral@127.0.0.1:5432/nextcrm_ci'
          pnpm exec prisma migrate deploy
      - name: Install signed document authorization overlay
        run: node scripts/install-nextcrm-bridge-overlay.mjs
      - name: Run NextCRM authorization route with REAL Prisma client, users and documents
        working-directory: integrations/nextcrm-upstream
        run: |
          pnpm exec jest --runInBand --no-coverage --runTestsByPath \
            'app/api/internal/erp-document-authorization/__tests__/route.integration.test.ts'
      - name: No Railway, Cloudflare, production data or GHCR access
        run: echo 'Only the disposable PostgreSQL service received synthetic NextCRM fixtures.'
