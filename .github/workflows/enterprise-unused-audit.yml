name: enterprise unused-code baseline

on:
  push:
    branches: [audit/unused-code-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript baseline
        run: pnpm exec tsc --noEmit
      - name: ESLint baseline
        run: pnpm lint
      - name: Build baseline
        run: pnpm build
      - name: Install Knip audit tool
        run: pnpm add --save-dev --ignore-scripts knip@latest
      - name: Knip JSON audit
        run: pnpm exec knip --reporter json > knip-report.json
        continue-on-error: true
      - name: Bundle inventory
        run: |
          node --input-type=module <<'EOF'
          import { readdir, stat, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          async function walk(dir, out=[]) {
            for (const entry of await readdir(dir, {withFileTypes:true})) {
              const path=join(dir,entry.name);
              if (entry.isDirectory()) await walk(path,out);
              else if (/.(js|mjs|css|map)$/.test(entry.name)) out.push({path,size:(await stat(path)).size});
            }
            return out;
          }
          const files=await walk("dist").catch(()=>[]);
          files.sort((a,b)=>b.size-a.size);
          await writeFile("bundle-inventory.json", JSON.stringify({generatedAt:new Date().toISOString(),files,totalBytes:files.reduce((n,f)=>n+f.size,0)},null,2));
          EOF
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-unused-baseline
          path: |
            knip-report.json
            bundle-inventory.json
