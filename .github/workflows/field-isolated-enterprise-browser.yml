name: CISNE Field isolated Chromium enterprise journey
on:
  pull_request:
    branches: [integration/nextcrm-homologation-wave1-20261118]
  push:
    branches: [integration/nextcrm-homologation-wave1-20261118]
permissions:
  contents: read
jobs:
  chromium-field:
    name: Real UI and OS-to-settlement with disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: ephemeral_ci_browser_only
          POSTGRES_DB: cisne_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://cisne_ci:ephemeral_ci_browser_only@127.0.0.1:5432/cisne_ci
      CISNE_STAGING_ACTOR_ID: ci-enterprise-browser-20261118
      CISNE_STAGING_PUBLIC_ORIGIN: https://cisne-web-staging-staging.up.railway.app
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install exact application dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          npm install --prefix /tmp/field-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/field-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate disposable database and apply real migrations twice
        env:
          NODE_ENV: test
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);if(process.env.GITHUB_ACTIONS!=='true'||u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/cisne_ci')process.exit(75)"
          pnpm db:migrate
          pnpm db:migrate
          node scripts/audit-nextcrm-migration-ledger-readonly.mjs
      - name: Build the exact GitHub HEAD
        run: pnpm build
      - name: Issue disposable secret for existing staging session policy
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          printf 'CISNE_STAGING_SESSION_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Start built application with isolated PostgreSQL
        env:
          NODE_ENV: production
          RAILWAY_ENVIRONMENT_NAME: staging
          CISNE_STAGING_ACCESS_MODE: private
          PORT: '8787'
        run: |
          pnpm exec vinext start > /tmp/field-browser-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8787/api/healthz >/dev/null; then
              echo FIELD_BROWSER_LOCAL_RUNTIME_READY
              exit 0
            fi
            sleep 3
          done
          tail -n 35 /tmp/field-browser-server.log
          exit 1
      - name: Start loopback HTTPS for existing Secure HttpOnly cookie
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/field-browser.key -out /tmp/field-browser.crt \
            -subj "/CN=127.0.0.1" >/dev/null 2>&1
          chmod 600 /tmp/field-browser.key
          node scripts/ci-field-browser-proxy.mjs > /tmp/field-browser-tls.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -skf --max-time 3 https://127.0.0.1:9443/api/healthz >/dev/null; then
              echo FIELD_BROWSER_LOCAL_HTTPS_READY
              exit 0
            fi
            sleep 2
          done
          tail -n 25 /tmp/field-browser-tls.log
          exit 1
      - name: Run Chromium and capture business requests
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/field-browser/node_modules/playwright/index.mjs
        run: node scripts/verify-field-business-browser.mjs
      - name: Print sanitized server errors only on failure
        if: failure()
        run: |
          if test -f /tmp/field-browser-server.log; then
            grep -E 'api.failure|ERROR|Error|TypeError' /tmp/field-browser-server.log | tail -n 20 || true
          fi
      - name: Upload real browser screenshots, trace and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-ci-enterprise-browser
          path: artifacts/field-browser/
          if-no-files-found: warn
          retention-days: 7
