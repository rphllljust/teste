name: build-and-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:domain
      - run: pnpm test:route-inventory
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

# Production publication is owned by the Sites platform. This workflow intentionally
# verifies the source but does not invoke Wrangler with unrelated Cloudflare secrets.
