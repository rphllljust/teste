name: build-and-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:domain
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

# Deployment is intentionally outside this verification workflow. Any authorized
# publication must target Railway project genuine-renewal, environment staging;
# production remains untouched until separately authorized.
