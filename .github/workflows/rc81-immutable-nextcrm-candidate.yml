name: RC81 immutable NextCRM candidate publication (no deployment)

on:
  push:
    branches:
      - integration/rc81-nextcrm-private-file-ticket-contract-20261116
    paths:
      - .github/workflows/rc81-immutable-nextcrm-candidate.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: rc81-immutable-candidate
  cancel-in-progress: false

jobs:
  publish-once:
    name: RC81 pinned image + SBOM + provenance
    if: github.repository == 'rphllljust/teste'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact RC81 revision and pinned NextCRM
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - name: Verify one-time reviewed parent and unchanged application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f4113aca501691a77b4f206fa3fc61697257638e"
          test "$(git -C integrations/nextcrm-upstream rev-parse HEAD)" = "d3bead9b44efe2cf94d0dfc2948af0f2c9270deb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/rc81-immutable-nextcrm-candidate.yml"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-nextcrm-dockerfile-derivation.mjs
          echo 'RC81_PROVENANCE_PIN_VERIFIED'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable SHA-tagged candidate
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nextcrm
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/rphllljust/cisne-nextcrm:rc81-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=rc81-candidate
          cache-from: type=gha,scope=nextcrm-candidate
          cache-to: type=gha,mode=max,scope=nextcrm-candidate
      - name: Record content-addressed artifact reference, not a deploy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          case "$IMAGE_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          {
            echo '## RC81 NextCRM candidate: NO DEPLOY'
            echo "Source commit: $GITHUB_SHA"
            echo "Image: ghcr.io/rphllljust/cisne-nextcrm@$IMAGE_DIGEST"
            echo 'OCI SBOM and build provenance are attached.'
            echo 'No Railway service or database was modified.'
          } >> "$GITHUB_STEP_SUMMARY"
